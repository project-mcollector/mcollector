name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/api/**/*.csproj') }}
          restore-keys: nuget-
      - name: API format check
        run: dotnet format apps/api/Api.sln --verify-no-changes

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm --filter web lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/api/**/*.csproj') }}
          restore-keys: nuget-
      - name: Build API
        run: |
          dotnet restore apps/api/Api.sln
          dotnet build apps/api/Api.sln --no-restore

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm --filter @mcollector/sdk build
      - name: Build frontend
        run: pnpm --filter web build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/api/**/*.csproj') }}
          restore-keys: nuget-
      - name: API tests
        run: dotnet test apps/api/Api.sln

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SDK tests
        run: pnpm --filter @mcollector/sdk test

  publish-sdk:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @mcollector/sdk build

      - name: Check if version already published
        id: version_check
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if npm view @mcollector/sdk@$VERSION version 2>/dev/null | grep -q "$VERSION"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish SDK
        if: steps.version_check.outputs.skip == 'false'
        run: pnpm --filter @mcollector/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mcollector
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API images
        run: |
          TAG=${{ github.sha }}
          R=${{ env.REGISTRY }}

          declare -A services=(
            [ingestion]="apps/api/src/Ingestion.Api/Dockerfile"
            [analytics]="apps/api/src/Analytics.Api/Dockerfile"
            [identity]="apps/api/src/Identity.Api/Dockerfile"
            [processor]="apps/api/src/EventProcessor/Dockerfile"
          )

          for name in "${!services[@]}"; do
            docker build \
              -t "$R/$name:$TAG" \
              -t "$R/$name:latest" \
              -f "${services[$name]}" \
              apps/api
            docker push "$R/$name:$TAG"
            docker push "$R/$name:latest"
          done

      - name: Build and push web image
        run: |
          TAG=${{ github.sha }}
          docker build \
            -t "${{ env.REGISTRY }}/web:$TAG" \
            -t "${{ env.REGISTRY }}/web:latest" \
            --build-arg NEXT_PUBLIC_BASE_URL=${{ secrets.WEB_BASE_URL }} \
            --build-arg NEXT_PUBLIC_ANALYTICS_API_KEY=${{ secrets.WEB_ANALYTICS_API_KEY }} \
            --build-arg NEXT_PUBLIC_ANALYTICS_PROJECT_ID=${{ secrets.WEB_ANALYTICS_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_ANALYTICS_API_HOST=${{ secrets.WEB_BASE_URL }} \
            -f apps/web/Dockerfile \
            .
          docker push "${{ env.REGISTRY }}/web:$TAG"
          docker push "${{ env.REGISTRY }}/web:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mcollector
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare VM directories
        run: |
          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="mkdir -p ~/mcollector/infrastructure/docker"

      - name: Copy docker-compose to VM
        run: |
          gcloud compute scp infrastructure/docker/docker-compose.prod.yml \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/docker-compose.prod.yml \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          RESEND_APITOKEN: ${{ secrets.RESEND_APITOKEN }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          RESEND_FORWARD_TO: ${{ secrets.RESEND_FORWARD_TO }}
          RESEND_FORWARD_FROM: ${{ secrets.RESEND_FORWARD_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          {
            echo "REGISTRY=${{ env.REGISTRY }}"
            echo "IMAGE_TAG=${{ github.sha }}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "ALLOWED_ORIGIN=${ALLOWED_ORIGIN}"
            echo "DB_CONNECTION_STRING=${DB_CONNECTION_STRING}"
            echo "RESEND_APITOKEN=${RESEND_APITOKEN}"
            echo "RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET}"
            echo "RESEND_FORWARD_TO=${RESEND_FORWARD_TO}"
            echo "RESEND_FORWARD_FROM=${RESEND_FORWARD_FROM}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
          } > /tmp/deploy.env

          gcloud compute scp /tmp/deploy.env \
            ${{ secrets.VM_USER }}@mcollector-vm:~/.deploy.env \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              trap 'rm -f ~/.deploy.env' EXIT
              gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet &&
              sudo mkdir -p /root/.docker &&
              sudo cp ~/.docker/config.json /root/.docker/config.json &&
              cd ~/mcollector &&
              sudo docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file ~/.deploy.env pull &&
              sudo docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file ~/.deploy.env up -d --remove-orphans &&
              sudo docker image prune -a -f
            "

      - name: Verify deployment
        run: |
          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              sleep 10 &&
              EXITED=\$(sudo docker compose -f ~/mcollector/infrastructure/docker/docker-compose.prod.yml ps --status exited --quiet | wc -l) &&
              [ \"\$EXITED\" -eq 0 ] || {
                echo \"ERROR: \$EXITED container(s) exited after deploy\"
                sudo docker compose -f ~/mcollector/infrastructure/docker/docker-compose.prod.yml ps
                exit 1
              }
            "
