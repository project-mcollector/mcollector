name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Change detection ─────────────────────────────────────────────────────────

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'package.json'
            packages:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'package.json'

  # ── Checks ───────────────────────────────────────────────────────────────────

  lint-api:
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/api/**/*.csproj') }}
          restore-keys: nuget-
      - name: API format check
        run: dotnet format apps/api/Api.sln --verify-no-changes

  check-js:
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build, lint, typecheck, test
        run: pnpm turbo run build lint typecheck test

  test-api:
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/api/**/*.csproj') }}
          restore-keys: nuget-
      - name: API tests
        run: dotnet test apps/api/Api.sln

  # ── Publish SDK (main only) ──────────────────────────────────────────────────

  publish-sdk:
    needs: [changes, check-js]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.packages == 'true' &&
      (needs.check-js.result == 'success' || needs.check-js.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm turbo run build --filter @mcollector/sdk
      - name: Check if version already published
        id: version_check
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          PREV=$(git show HEAD^:packages/sdk/package.json 2>/dev/null \
            | node -e "let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).version??'')}catch{console.log('')}})")
          if [ -n "$PREV" ] && [ "$PREV" = "$VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if npm view @mcollector/sdk@$VERSION version &>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish SDK
        if: steps.version_check.outputs.skip == 'false'
        working-directory: packages/sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Docker builds (main only, API services run in parallel via matrix) ───────
  # Skipped when only packages/** changed (SDK-only push) — nothing to deploy.
  # Both images are always rebuilt together so IMAGE_TAG=${{ github.sha }} is
  # consistent across all services in the deploy step.

  build-and-push-api:
    needs: [changes, lint-api, test-api]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.api == 'true' &&
      (needs.lint-api.result == 'success' || needs.lint-api.result == 'skipped') &&
      (needs.test-api.result == 'success' || needs.test-api.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: ingestion, dockerfile: apps/api/src/Ingestion.Api/Dockerfile }
          - { name: analytics, dockerfile: apps/api/src/Analytics.Api/Dockerfile }
          - { name: identity,  dockerfile: apps/api/src/Identity.Api/Dockerfile }
          - { name: processor, dockerfile: apps/api/src/EventProcessor/Dockerfile }
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mcollector
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  build-and-push-web:
    needs: [changes, check-js]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.web == 'true' &&
      (needs.check-js.result == 'success' || needs.check-js.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mcollector
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/web:latest
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ secrets.WEB_BASE_URL }}
            NEXT_PUBLIC_ANALYTICS_API_KEY=${{ secrets.WEB_ANALYTICS_API_KEY }}
            NEXT_PUBLIC_ANALYTICS_PROJECT_ID=${{ secrets.WEB_ANALYTICS_PROJECT_ID }}
            NEXT_PUBLIC_ANALYTICS_API_HOST=${{ secrets.WEB_BASE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # Two independent jobs so an API-only push deploys only API services and a
  # web-only push deploys only the web container. They can run in parallel when
  # both changed in the same commit.

  deploy-api:
    needs: [build-and-push-api]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build-and-push-api.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mcollector
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare VM directories
        run: |
          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="mkdir -p ~/mcollector/infrastructure/docker/prometheus ~/mcollector/infrastructure/docker/grafana/provisioning/datasources ~/mcollector/infrastructure/docker/grafana/provisioning/dashboards"

      - name: Copy infrastructure configs to VM
        run: |
          gcloud compute scp infrastructure/docker/docker-compose.prod.yml \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/docker-compose.prod.yml \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud compute scp infrastructure/docker/prometheus/prometheus.yml \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/prometheus/prometheus.yml \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud compute scp infrastructure/docker/grafana/provisioning/datasources/prometheus.yml \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/grafana/provisioning/datasources/prometheus.yml \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud compute scp infrastructure/docker/grafana/provisioning/dashboards/dashboards.yml \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/grafana/provisioning/dashboards/dashboards.yml \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud compute scp infrastructure/docker/grafana/provisioning/dashboards/identity-auth.json \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/grafana/provisioning/dashboards/identity-auth.json \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud compute scp infrastructure/docker/grafana/provisioning/dashboards/services-overview.json \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/grafana/provisioning/dashboards/services-overview.json \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy API services
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PASSKEY_SERVER_DOMAIN: ${{ secrets.PASSKEY_SERVER_DOMAIN }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          RESEND_APITOKEN: ${{ secrets.RESEND_APITOKEN }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          RESEND_FORWARD_TO: ${{ secrets.RESEND_FORWARD_TO }}
          RESEND_FORWARD_FROM: ${{ secrets.RESEND_FORWARD_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          {
            echo "REGISTRY=${{ env.REGISTRY }}"
            echo "API_IMAGE_TAG=${{ github.sha }}"
            echo "WEB_IMAGE_TAG=latest"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "PASSKEY_SERVER_DOMAIN=${PASSKEY_SERVER_DOMAIN}"
            echo "ALLOWED_ORIGIN=${ALLOWED_ORIGIN}"
            echo "DB_CONNECTION_STRING=${DB_CONNECTION_STRING}"
            echo "RESEND_APITOKEN=${RESEND_APITOKEN}"
            echo "RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET}"
            echo "RESEND_FORWARD_TO=${RESEND_FORWARD_TO}"
            echo "RESEND_FORWARD_FROM=${RESEND_FORWARD_FROM}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            echo "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}"
          } > /tmp/deploy.env

          gcloud compute scp /tmp/deploy.env \
            ${{ secrets.VM_USER }}@mcollector-vm:/tmp/deploy.env \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              trap 'rm -f /tmp/deploy.env' EXIT
              gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet &&
              sudo mkdir -p /root/.docker &&
              sudo cp ~/.docker/config.json /root/.docker/config.json &&
              cd ~/mcollector &&
              sudo docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file /tmp/deploy.env pull ingestion analytics identity processor &&
              sudo docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file /tmp/deploy.env up -d ingestion analytics identity processor &&
              sudo docker image prune -a -f
            "

      - name: Verify API deployment
        run: |
          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              sleep 10 &&
              EXITED=\$(sudo docker compose -f ~/mcollector/infrastructure/docker/docker-compose.prod.yml ps ingestion analytics identity processor --status exited --quiet | wc -l) &&
              [ \"\$EXITED\" -eq 0 ] || {
                echo \"ERROR: \$EXITED API container(s) exited after deploy\"
                sudo docker compose -f ~/mcollector/infrastructure/docker/docker-compose.prod.yml ps
                exit 1
              }
            "

  deploy-web:
    needs: [build-and-push-web]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build-and-push-web.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mcollector
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy docker-compose to VM
        run: |
          gcloud compute scp infrastructure/docker/docker-compose.prod.yml \
            ${{ secrets.VM_USER }}@mcollector-vm:~/mcollector/infrastructure/docker/docker-compose.prod.yml \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy web
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PASSKEY_SERVER_DOMAIN: ${{ secrets.PASSKEY_SERVER_DOMAIN }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          RESEND_APITOKEN: ${{ secrets.RESEND_APITOKEN }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          RESEND_FORWARD_TO: ${{ secrets.RESEND_FORWARD_TO }}
          RESEND_FORWARD_FROM: ${{ secrets.RESEND_FORWARD_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          {
            echo "REGISTRY=${{ env.REGISTRY }}"
            echo "API_IMAGE_TAG=latest"
            echo "WEB_IMAGE_TAG=${{ github.sha }}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "PASSKEY_SERVER_DOMAIN=${PASSKEY_SERVER_DOMAIN}"
            echo "ALLOWED_ORIGIN=${ALLOWED_ORIGIN}"
            echo "DB_CONNECTION_STRING=${DB_CONNECTION_STRING}"
            echo "RESEND_APITOKEN=${RESEND_APITOKEN}"
            echo "RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET}"
            echo "RESEND_FORWARD_TO=${RESEND_FORWARD_TO}"
            echo "RESEND_FORWARD_FROM=${RESEND_FORWARD_FROM}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            echo "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}"
          } > /tmp/deploy.env

          gcloud compute scp /tmp/deploy.env \
            ${{ secrets.VM_USER }}@mcollector-vm:/tmp/deploy.env \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              trap 'rm -f /tmp/deploy.env' EXIT
              gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet &&
              sudo mkdir -p /root/.docker &&
              sudo cp ~/.docker/config.json /root/.docker/config.json &&
              cd ~/mcollector &&
              sudo docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file /tmp/deploy.env pull web &&
              sudo docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file /tmp/deploy.env up -d web &&
              sudo docker image prune -a -f
            "

      - name: Verify web deployment
        run: |
          gcloud compute ssh ${{ secrets.VM_USER }}@mcollector-vm \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              sleep 10 &&
              EXITED=\$(sudo docker compose -f ~/mcollector/infrastructure/docker/docker-compose.prod.yml ps web --status exited --quiet | wc -l) &&
              [ \"\$EXITED\" -eq 0 ] || {
                echo \"ERROR: web container exited after deploy\"
                sudo docker compose -f ~/mcollector/infrastructure/docker/docker-compose.prod.yml ps
                exit 1
              }
            "