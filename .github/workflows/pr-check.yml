name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PR is squashed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            if (commits.length > 1) {
              core.setFailed('PR has multiple commits. Please squash before merging');
            }

      - name: Lint PR title
        uses: wagoid/commitlint-github-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          configFile: .commitlintrc.js
          fail_on_non_conventional: true

      - name: Ensure npm lockfiles are not committed
        run: |
          if git ls-files '**/package-lock.json' | grep -q .; then
            echo "Found package-lock.json files in pnpm-managed repo:" >&2
            git ls-files '**/package-lock.json' >&2
            exit 1
          fi