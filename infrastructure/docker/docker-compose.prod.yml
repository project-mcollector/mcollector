services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: mcollector
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mcollector"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists
      --topic raw-events
      --partitions 3
      --replication-factor 1 && echo 'Topic raw-events created'"
    restart: "no"

  ingestion:
    image: ${REGISTRY}/ingestion:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?DB_CONNECTION_STRING must be set}
      - Kafka__BootstrapServers=kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ingest/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  analytics:
    image: ${REGISTRY}/analytics:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?DB_CONNECTION_STRING must be set}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - AllowedOrigins=${ALLOWED_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  identity:
    image: ${REGISTRY}/identity:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?DB_CONNECTION_STRING must be set}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - AllowedOrigins=${ALLOWED_ORIGIN:-http://localhost:3000}
      - RESEND_APITOKEN=${RESEND_APITOKEN:?RESEND_APITOKEN must be set}
      - FrontendUrl=${FRONTEND_URL:?FRONTEND_URL must be set}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  processor:
    image: ${REGISTRY}/processor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      analytics:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?DB_CONNECTION_STRING must be set}
      - Kafka__BootstrapServers=kafka:29092

  web:
    image: ${REGISTRY}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - INGESTION_INTERNAL_URL=http://ingestion:8080
    depends_on:
      ingestion:
        condition: service_healthy
      analytics:
        condition: service_healthy
      identity:
        condition: service_healthy

volumes:
  postgres_data:
