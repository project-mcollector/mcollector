services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: mcollector
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mcollector"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists
      --topic raw-events
      --partitions 3
      --replication-factor 1 && echo 'Topic raw-events created'"
    restart: "no"

  ingestion:
    build:
      context: ../../apps/api
      dockerfile: src/Ingestion.Api/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Kafka__BootstrapServers=kafka:29092

  analytics:
    build:
      context: ../../apps/api
      dockerfile: src/Analytics.Api/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Kafka__BootstrapServers=kafka:29092

  identity:
    build:
      context: ../../apps/api
      dockerfile: src/Identity.Api/Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Kafka__BootstrapServers=kafka:29092

  processor:
    build:
      context: ../../apps/api
      dockerfile: src/EventProcessor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Kafka__BootstrapServers=kafka:29092

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - ingestion
      - analytics
      - identity
    environment:
      - NEXT_PUBLIC_API_URL=http://ingestion:8080
      - NEXT_PUBLIC_IDENTITY_URL=http://identity:8080
      - NEXT_PUBLIC_ANALYTICS_URL=http://analytics:8080
      - NEXT_PUBLIC_INGESTION_URL=http://ingestion:8080
