services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: mcollector
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mcollector"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists
      --topic raw-events
      --partitions 3
      --replication-factor 1 && echo 'Topic raw-events created'"
    restart: "no"

  ingestion:
    build:
      context: ../../apps/api
      dockerfile: src/Ingestion.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Kafka__BootstrapServers=kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ingest/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  analytics:
    build:
      context: ../../apps/api
      dockerfile: src/Analytics.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - AllowedOrigins=http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  identity:
    build:
      context: ../../apps/api
      dockerfile: src/Identity.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - AllowedOrigins=http://localhost:3000
      - RESEND_APITOKEN=${RESEND_APITOKEN:?RESEND_APITOKEN must be set}
      - Passkey__ServerDomain=localhost
      - FrontendUrl=http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  processor:
    build:
      context: ../../apps/api
      dockerfile: src/EventProcessor/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      analytics:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mcollector;Username=app;Password=app
      - Kafka__BootstrapServers=kafka:29092

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_BASE_URL=http://localhost:3000
        - NEXT_PUBLIC_IDENTITY_URL=http://localhost:5003
        - NEXT_PUBLIC_ANALYTICS_URL=http://localhost:5002
        - NEXT_PUBLIC_INGESTION_URL=http://localhost:5001
        - NEXT_PUBLIC_ANALYTICS_API_KEY
        - NEXT_PUBLIC_ANALYTICS_PROJECT_ID
        - NEXT_PUBLIC_ANALYTICS_API_HOST
    environment:
      - INGESTION_INTERNAL_URL=http://ingestion:8080
      - RESEND_APITOKEN=${RESEND_APITOKEN:?RESEND_APITOKEN must be set}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:?RESEND_WEBHOOK_SECRET must be set}
      - RESEND_FORWARD_TO=${RESEND_FORWARD_TO:?RESEND_FORWARD_TO must be set}
      - RESEND_FORWARD_FROM=${RESEND_FORWARD_FROM:?RESEND_FORWARD_FROM must be set}
    ports:
      - "3000:3000"
    depends_on:
      ingestion:
        condition: service_healthy
      analytics:
        condition: service_healthy
      identity:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - identity
      - analytics
      - ingestion
      - processor

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
