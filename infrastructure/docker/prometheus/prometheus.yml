global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: identity-api
    static_configs:
      - targets: ["identity:8080"]
    metrics_path: /metrics

  - job_name: analytics-api
    static_configs:
      - targets: ["analytics:8080"]
    metrics_path: /metrics

  - job_name: ingestion-api
    static_configs:
      - targets: ["ingestion:8080"]
    metrics_path: /metrics

  - job_name: event-processor
    static_configs:
      - targets: ["processor:8080"]
    metrics_path: /metrics
